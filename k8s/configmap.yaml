apiVersion: v1
kind: ConfigMap
metadata:
  name: oss-videotheque-config
  namespace: oss-videotheque
  labels:
    app: oss-videotheque
data:
  # ── Backend ────────────────────────────────────
  PORT: "4000"
  NODE_ENV: "production"
  DB_HOST: "db"
  DB_PORT: "5432"
  DB_NAME: "video_archive"
  DB_USER: "postgres"
  JWT_EXPIRES_IN: "24h"
  STORAGE_PATH: "/app/storage"
  FFMPEG_PATH: "/usr/bin/ffmpeg"
  FFPROBE_PATH: "/usr/bin/ffprobe"

  # ── Database ───────────────────────────────────
  POSTGRES_DB: "video_archive"
  POSTGRES_USER: "postgres"

---
apiVersion: v1
kind: Secret
metadata:
  name: oss-videotheque-secrets
  namespace: oss-videotheque
  labels:
    app: oss-videotheque
type: Opaque
stringData:
  DB_PASSWORD: "changeme"
  JWT_SECRET: "change_this_to_a_long_random_string"
  POSTGRES_PASSWORD: "changeme"
